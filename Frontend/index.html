<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de gastos</title>
    <link rel="stylesheet" href="css/proyect.css">
</head>
<body>

    <div class="card">
        <h2>Administración de gastos</h2>
        <p class="subtitle">Registra tus ingresos y gastos con claridad y estilo.</p>

        <form id="gasto-form">
            <label for="monto">Monto</label>
            <input type="number" id="monto" placeholder="Ej: 250000" required>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>

            <label for="categoria">Categoría</label>
            <select id="categoria" required>
                <option value="" disabled selected>Seleccione categoría...</option>
                <option value="Salario">Salario</option>
                <option value="Comida">Comida</option>
                <option value="Transporte">Transporte</option>
                <option value="Entretenimiento">Entretenimiento</option>
            </select>

            <button type="submit" class="btn-guardar">Guardar</button>
        </form>

        <h3 class="movimientos-titulo">Movimientos registrados</h3>
        <div id="movimientos-lista">
            <!-- Los movimientos se insertarán aquí dinámicamente con JavaScript -->
        </div>
    </div>

    <script src="js/proyect.js"></script>
</body>
</html>
